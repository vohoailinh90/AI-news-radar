lang: ja
one_liner: 毎日のAIニュース：新モデル、ベンチマーク、無料・値下げ情報、ClaudeやCodexの利用上限リセットまで。
audience: 日本の会社でAIを日常的に使うエンジニアや業務自動化担当者。何が使う価値のある情報かを短時間で知りたい人。
pains:
- AIニュースが多すぎて重要なものが分からない
- 無料化や値下げの機会を逃す
- 利用上限に達しても、いつリセットされるか分からない
- 公式情報と噂の区別がつかない
promise: 各ニュースに出典と確度を明記し、未確認の情報は断定せず「未確認」と書きます。
objections:
- q: 噂が混ざりませんか？
  a: コミュニティ発の情報は、公式の裏付けが取れるまで「未確認」と表示します。
vocabulary:
- 利用上限
- リセット
- 無料
- 値下げ
- ベンチマーク
- 新モデル
angles:
- 今日の注目ニュース
- 試す価値のある無料モデル
- 値下げしたのはどこ？
- ベンチマーク首位は？
tone: です・ます調で簡潔に。出典を明記し、煽らず、断定しすぎない。
