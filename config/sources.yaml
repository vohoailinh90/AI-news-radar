# Where the radar looks. `trust: primary` = the vendor or a pricing/leaderboard file says it, so a
# fact from it may be written as verified. `trust: community` = people report it (Hacker News):
# it is posted as "reported" until a primary source corroborates it.
#
# live_checked: the date the URL was last fetched successfully by a human or CI run, or false if it
# never has been (a new source starts as false). A false here is a to-do, not a defect: run
# `python radar.py scan` once, or read the `ok` column of the next daily run's REPORT.md.
sources:
  - id: claude-code-changelog
    kind: changelog_md
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    name: Claude Code changelog
    vendor: anthropic
    trust: primary
    first_run_versions: 1       # first run reports only the newest version, then only newer ones
    max_bytes: 3000000
    live_checked: "2026-10-13"

  - id: anthropic-news
    kind: rss
    # A community-generated mirror of anthropic.com/news (Anthropic publishes no feed). Every item
    # link points at anthropic.com, which is what a post cites.
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    name: Anthropic news
    vendor: anthropic
    trust: primary
    allowed_hosts: [www.anthropic.com, anthropic.com]   # a mirror may only point at the vendor's own site
    confirm_page: true           # ...and an event stays primary only if that page, fetched by the radar, carries the same headline
    max_age_days: 14
    live_checked: "2026-10-13"

  - id: codex-releases
    kind: rss
    url: https://github.com/openai/codex/releases.atom
    name: Codex releases
    release_notes: true          # the release body is read bullet by bullet, like a changelog
    vendor: openai
    trust: primary
    max_age_days: 14
    live_checked: "2026-10-19"

  - id: gemini-cli-releases
    kind: rss
    url: https://github.com/google-gemini/gemini-cli/releases.atom
    name: Gemini CLI releases
    release_notes: true          # the release body is read bullet by bullet, like a changelog
    vendor: google
    trust: primary
    max_age_days: 14
    live_checked: "2026-10-19"

  - id: openai-news
    kind: rss
    url: https://openai.com/news/rss.xml
    name: OpenAI news
    vendor: openai
    trust: primary
    max_age_days: 14
    live_checked: "2026-10-19"

  - id: deepmind-blog
    kind: rss
    url: https://deepmind.google/blog/rss.xml
    name: Google DeepMind blog
    vendor: google
    trust: primary
    max_age_days: 14
    live_checked: "2026-10-19"

  - id: huggingface-blog
    kind: rss
    url: https://huggingface.co/blog/feed.xml
    name: Hugging Face blog
    vendor: other
    trust: primary
    max_age_days: 14
    live_checked: "2026-10-19"

  - id: openrouter-models
    kind: openrouter
    # Public model list with prices. Diffed against the last snapshot: new models, models that
    # became free, price drops. Needs no key.
    url: https://openrouter.ai/api/v1/models
    name: OpenRouter model list
    vendor: other
    trust: primary
    min_drop_pct: 20
    live_checked: "2026-10-19"

  - id: aider-polyglot
    kind: yaml_leaderboard
    url: https://raw.githubusercontent.com/Aider-AI/aider/main/aider/website/_data/polyglot_leaderboard.yml
    name: Aider polyglot leaderboard
    vendor: other
    trust: primary
    benchmark: Aider polyglot
    fields: {id: dirname, name: model, score: pass_rate_2, date: date, cost: total_cost}
    stale_days: 90              # if the newest entry is older, the run report says the source is stale
    live_checked: "2026-10-13"

  - id: hn-ai
    kind: hn
    # Hacker News via the public Algolia API: a rough "what is hot" signal, always community.
    url: https://hn.algolia.com/api/v1/search_by_date
    name: Hacker News
    vendor: other
    trust: community
    queries: ["claude", "codex", "gpt-5", "gemini", "deepseek", "qwen", "usage limit", "free tier llm"]
    min_points: 100
    max_age_days: 3
    live_checked: "2026-10-19"

  # Ranking boards: a public leaderboard whose own scores and costs make one comparison (radar/sources/ranking.py).
  # The first scan reports the board instead of recording a baseline; after that only when its top row or its value
  # pick changes, and not within cooldown_days. A row is an agent + model + setting together, never a model alone.
  #
  # Deliberately NOT here (checked 2026-10-17):
  #  - Artificial Analysis Coding Agent Index: its terms of use forbid scripts and agents that scrape the site, forbid
  #    copying or republishing its content, and its free API is "internal use only; no redistribution". Posting its numbers
  #    needs a commercial licence from them.
  #  - ReviewBench (review-bench.ai): robots.txt says "Disallow: /", and the board has no cost column.
  - id: terminal-bench-4
    kind: ranking_board
    url: https://www.tbench.ai/leaderboard
    name: Terminal-Bench 4.0
    vendor: other
    trust: primary
    format: tbench_leaderboard
    expect_title: Terminal-Bench 4.0   # the page's own board title; the URL has no version, so a different default board is refused
    benchmark: Terminal-Bench 4.0
    score_unit: "%"
    cost_unit: trial
    value_min_share: 0.85        # the value pick scores at least this share of the top score...
    value_max_cost_share: 0.5    # ...for at most this share of the top row's cost; otherwise there is no story
    cooldown_days: 14            # a changed pick is not reported again within this many days of the last story
    max_age_days: 45             # a board not updated for longer than this is stale: reported in the run, no story
    min_rows: 10                 # fewer usable rows means the page changed shape
    max_bytes: 3000000
    live_checked: "2026-10-17"
