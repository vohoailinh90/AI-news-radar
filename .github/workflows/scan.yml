name: Daily scan

on:
  schedule:
    - cron: "17 22 * * *"      # 22:17 UTC = 05:17 in Vietnam, 07:17 in Japan: the issue is ready for the morning
  workflow_dispatch:

permissions:
  contents: write              # commits data/ and out/ back to the branch

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan and export
        # exit 3 = nothing worth posting today (not a failure); 2 = every source failed (a failure)
        run: |
          set +e
          python radar.py run
          code=$?
          if [ "$code" -eq 3 ]; then echo "nothing worth posting today"; exit 0; fi
          exit $code
      - name: Commit state and the new issue
        run: |
          git config user.name "ai-news-radar"
          git config user.email "ai-news-radar@users.noreply.github.com"
          git add data out
          if ! git diff --cached --quiet; then
            git commit -m "scan $(date -u +%F)"
            git push
          fi
